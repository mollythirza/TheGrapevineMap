<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Grassroots Venue Map</title>
  <!-- Leaflet CSS for Map Integration -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 20px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    /* Map Viewport Container */
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background-color: #111;
    }

    /* Floating Venue Search Overlay */
    .search-overlay {
      position: fixed;
      top: 80px;
      left: 20px;
      z-index: 2000;
      background: rgba(13, 13, 13, 0.9);
      border: 1px solid #ff007f;
      padding: 12px;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      backdrop-filter: blur(6px);
      width: 300px;
    }

    .search-overlay h3 {
      font-size: 12px;
      color: #ff007f;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .venue-search-input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
    }

    .venue-search-input:focus {
      border-color: #ff007f;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
    }

    .search-results {
      max-height: 150px;
      overflow-y: auto;
      margin-top: 6px;
    }

    .search-result-item {
      padding: 6px 8px;
      font-size: 11px;
      color: #ccc;
      cursor: pointer;
      border-bottom: 1px solid #222;
      transition: background 0.2s, color 0.2s;
    }

    .search-result-item:hover {
      background: #ff007f;
      color: #000;
    }

    /* Custom Leaflet Dark Mode Popup Styling */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #141414 !important;
      color: #fff !important;
      border: 1px solid #ff007f !important;
      font-family: 'Courier New', Courier, monospace !important;
      border-radius: 6px !important;
    }

    .leaflet-popup-content h3 {
      color: #ff007f;
      font-size: 14px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .leaflet-popup-content p {
      font-size: 11px;
      color: #bbb;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Top Header linking back ONLY to the Main Hub -->
  <header>
    <a href="index.html" class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:14px;\'>THE GRAPEVINE</h1>'">
    </a>
    <nav class="nav-links">
      <a href="index.html">← Back to Hub</a>
    </nav>
  </header>

  <!-- Floating Search & Marker Lookup Bar -->
  <div class="search-overlay">
    <h3>🔍 Search Grassroots Venues</h3>
    <input type="text" id="venue-search" class="venue-search-input" placeholder="Search venue name, area..." oninput="filterVenues()">
    <div id="search-results" class="search-results"></div>
  </div>

  <!-- Interactive Map Canvas -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    // Initialize Leaflet Map (Default centered on UK / Scene hubs)
    const map = L.map('map', { zoomControl: false }).setView([51.5074, -0.1278], 13);

    // Add custom dark-themed CartoDB tiles to match DIY aesthetic
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Sample grassroots venues database (Syncs with Firebase or local markers)
    const venues = [
      { id: 1, name: "The DIY Basement", lat: 51.505, lng: -0.09, desc: "Independent hardcore & punk basement venue. BYOB.", type: "Venue" },
      { id: 2, name: "Underground Social Club", lat: 51.515, lng: -0.11, desc: "Community arts space, all-ages shows and zine distros.", type: "Community Space" },
      { id: 3, name: "The Black Box", lat: 51.502, lng: -0.13, desc: " DIY noise, ambient, and underground electronic club.", type: "Venue" }
    ];

    const markersLayer = L.layerGroup().addTo(map);
    const markerRegistry = {};

    function renderMarkers(filter = "") {
      markersLayer.clearLayers();
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.innerHTML = '';

      venues.forEach(v => {
        if (filter && !v.name.toLowerCase().includes(filter.toLowerCase()) && !v.desc.toLowerCase().includes(filter.toLowerCase())) {
          return;
        }

        // Add dropdown search result
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.innerText = `${v.name} (${v.type})`;
        item.onclick = () => {
          map.setView([v.lat, v.lng], 16);
          markerRegistry[v.id].openPopup();
        };
        resultsContainer.appendChild(item);

        // Custom Neon Pink Marker Pin
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: '<div style="background:#ff007f; width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow: 0 0 10px #ff007f;"></div>',
          iconSize: [14, 14],
          iconPoint: [7, 7]
        });

        const marker = L.marker([v.lat, v.lng], { icon: customIcon })
          .bindPopup(`<h3>${v.name}</h3><p>${v.desc}</p>`);

        markersLayer.addLayer(marker);
        markerRegistry[v.id] = marker;
      });
    }

    function filterVenues() {
      const query = document.getElementById('venue-search').value;
      renderMarkers(query);
    }

    // Initial render
    renderMarkers();
  </script>
</body>
</html>
