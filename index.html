<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grassroots Venue Map — The Grapevine</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Leaflet Geocoder (Address Search) CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    /* Fixed Top Black Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 20px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    /* Full-Height Map Container Fix */
    #map {
      width: 100vw;
      height: calc(100vh - 60px);
      position: absolute;
      top: 60px;
      left: 0;
      z-index: 1;
      background-color: #111;
    }

    /* Sidebar Directory */
    #sidebar {
      position: fixed;
      top: 60px;
      left: 0;
      bottom: 0;
      z-index: 50;
      width: 320px;
      background: rgba(14, 14, 14, 0.95);
      border-right: 1px solid rgba(255, 0, 127, 0.3);
      display: flex;
      flex-direction: column;
      box-shadow: 5px 0 20px rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
    }

    .custom-input {
      background: #0d0d0d;
      color: #fff;
      border: 1px solid #ff007f;
      padding: 8px 12px;
      width: 100%;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
      font-size: 12px;
    }

    .custom-input:focus {
      border-color: #ff3399;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
    }

    /* Leaflet Popups matching theme */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #141414 !important;
      color: #fff !important;
      border: 2px solid #ff007f !important;
      font-family: 'Courier New', Courier, monospace !important;
      border-radius: 6px !important;
    }

    /* Geocoder Address Search Box Styling */
    .leaflet-control-geocoder {
      background: #141414 !important;
      border: 2px solid #ff007f !important;
      border-radius: 6px !important;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4) !important;
    }

    .leaflet-control-geocoder-icon {
      filter: invert(1) hue-rotate(270deg) !important;
    }

    .leaflet-control-geocoder-form input {
      color: #fff !important;
      background: #141414 !important;
      font-family: inherit !important;
    }
  </style>
</head>
<body class="overflow-hidden m-0 p-0">

  <!-- Header -->
  <header>
    <a href="../index.html" class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:16px;\'>THE GRAPEVINE</h1>'">
    </a>
    <div class="nav-links flex items-center gap-4">
      <span id="auth-status" class="text-[10px] text-gray-400 hidden sm:inline">● Live Sync</span>
      <a href="../index.html">← Back to Hub</a>
    </div>
  </header>

  <!-- Sidebar Directory -->
  <aside id="sidebar">
    <div class="p-4 border-b border-[#262626] bg-[#101010] flex justify-between items-center">
      <h2 class="text-xs font-bold text-[#ff007f] uppercase tracking-wider">Community Directory</h2>
    </div>
    <div class="p-4 border-b border-[#262626]">
      <input type="text" id="search-input" placeholder="Search venues, genres, addresses..." class="custom-input" oninput="filterVenues()">
    </div>
    <div id="venue-list" class="flex-1 overflow-y-auto p-4 space-y-3">
      <p class="text-xs text-gray-400 text-center py-6">Loading directory...</p>
    </div>
  </aside>

  <!-- Map Area -->
  <main id="map"></main>

  <!-- Leaflet JS & Geocoder -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- Firebase Realtime Database Sync -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBozbn-0iQNhjuAcmL-dYOUtbhIYTjccYk",
      authDomain: "the-grapevine-5c046.firebaseapp.com",
      databaseURL: "https://the-grapevine-5c046-default-rtdb.firebaseio.com",
      projectId: "the-grapevine-5c046",
      storageBucket: "the-grapevine-5c046.firebasestorage.app",
      messagingSenderId: "606976230856",
      appId: "1:606976230856:web:161a12734239f248ce2cfd",
      measurementId: "G-V1KW1QSNWS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const venuesRef = ref(db, 'venues');

    // Initialize Map
    const map = L.map('map', { zoomControl: false }).setView([51.5074, -0.1278], 11);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Reliable Dark Tiles Engine (CartoDB Dark Matter with OpenStreetMap fallback)
    const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Ensure map tiles calculate correct container size after DOM load
    setTimeout(() => { map.invalidateSize(); }, 200);
    setTimeout(() => { map.invalidateSize(); }, 600);

    // Address Search Geocoder Control
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: "Search address, street, or venue...",
      position: 'topright'
    })
    .on('markgeocode', function(e) {
      const bbox = e.geocode.bbox;
      const poly = L.polygon([bbox.getSouthEast(), bbox.getNorthEast(), bbox.getNorthWest(), bbox.getSouthWest()]);
      map.fitBounds(poly.getBounds());
      
      L.popup()
        .setLatLng(e.geocode.center)
        .setContent(`
          <div style="min-width: 200px">
            <h4 style="margin:0 0 6px 0; color:#ff007f; font-weight:bold;">Pin Venue at Searched Address</h4>
            <label style="font-size:11px; color:#aaa;">Venue Name:</label>
            <input id="new-name" class="custom-input" placeholder="e.g. The Sound Box" />
            
            <label style="font-size:11px; color:#aaa;">Address:</label>
            <input id="new-address" class="custom-input" value="${e.geocode.name}" />

            <label style="font-size:11px; color:#aaa;">Genre / Vibe:</label>
            <input id="new-genre" class="custom-input" placeholder="e.g. Punk / Hardcore" />
            
            <label style="font-size:11px; color:#aaa;">Your Name:</label>
            <input id="new-author" class="custom-input" placeholder="e.g. Molly" />
            
            <label style="font-size:11px; color:#aaa;">Community Note:</label>
            <input id="new-note" class="custom-input" placeholder="Why do you love it?" />
            
            <button onclick="window.saveNewVenue(${e.geocode.center.lat}, ${e.geocode.center.lng})" style="width:100%; background:#ff007f; color:#000; font-weight:bold; padding:8px; border:none; border-radius:4px; cursor:pointer; margin-top:8px;">Submit Pin</button>
          </div>
        `)
        .openOn(map);
    })
    .addTo(map);

    const pinkMarkerIcon = L.divIcon({
      className: 'custom-pink-marker',
      html: `<div style="background-color: #ff007f; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 12px #ff007f;"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    let venues = [];
    let markersLayer = L.layerGroup().addTo(map);

    const defaultVenues = [
      { id: 'default-1', name: "The Black Heart", genre: "Rock / Metal / DIY", address: "2-3 Greenland Pl, London NW1 0AP", lat: 51.5385, lng: -0.1415, note: "Legendary Camden rock pub with incredible atmosphere and upstairs gigs.", author: "Molly" },
      { id: 'default-2', name: "New Cross Inn", genre: "Punk / Alternative / Indie", address: "323 New Cross Rd, London SE14 6AS", lat: 51.4745, lng: -0.0385, note: "Heart of South London's grassroots live music scene.", author: "Molly" }
    ];

    onValue(venuesRef, (snapshot) => {
      const data = snapshot.val();
      venues = [...defaultVenues];

      if (data) {
        Object.keys(data).forEach((key) => {
          if (!venues.some(v => v.id === key)) {
            venues.push({ id: key, ...data[key] });
          }
        });
      }
      renderVenues(venues);
    });

    function renderVenues(filteredVenues) {
      markersLayer.clearLayers();
      const listContainer = document.getElementById('venue-list');
      listContainer.innerHTML = '';

      if (!filteredVenues || filteredVenues.length === 0) {
        listContainer.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">No venues found.</p>';
        return;
      }

      filteredVenues.forEach(v => {
        const marker = L.marker([v.lat, v.lng], { icon: pinkMarkerIcon }).addTo(markersLayer);
        
        const displayAddress = v.address || `${v.lat.toFixed(4)}, ${v.lng.toFixed(4)}`;
        const mapsQuery = v.address ? `${v.name}, ${v.address}` : `${v.lat},${v.lng}`;
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapsQuery)}`;

        marker.bindPopup(`
          <div style="font-family:monospace; min-width:180px;">
            <h3 style="color:#ff007f; font-weight:bold; font-size:15px; margin:0 0 4px 0; text-transform:uppercase;">${v.name}</h3>
            <p style="color:#aaa; font-size:11px; margin:0 0 4px 0;">📍 ${displayAddress}</p>
            <p style="color:#fff; font-size:12px; margin:0 0 4px 0;"><strong>Genre:</strong> ${v.genre}</p>
            <p style="color:#888; font-size:10px; margin:0 0 6px 0;"><strong>Marked by:</strong> ${v.author || 'Anonymous'}</p>
            <p style="color:#ccc; font-size:12px; margin:0 0 8px 0;">${v.note || ''}</p>
            <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block; font-size:11px; color:#ff007f; text-decoration:underline;">Get Directions ↗</a>
          </div>
        `);

        const card = document.createElement('div');
        card.className = "bg-[#141414] border border-[#ff007f]/40 rounded p-3 hover:border-[#ff007f] cursor-pointer transition shadow";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <h4 class="font-bold text-xs text-[#ff007f] uppercase">${v.name}</h4>
            <span class="text-[10px] bg-[#ff007f]/20 text-[#ff007f] px-1.5 py-0.5 rounded">${v.genre}</span>
          </div>
          <div class="text-[11px] text-gray-400 mt-1 truncate">📍 ${displayAddress}</div>
          <p class="text-xs text-gray-300 mt-1 line-clamp-2">${v.note || ''}</p>
          <div class="text-[10px] text-gray-500 mt-2">Marked by: <span class="text-[#ff007f]">${v.author || 'Anonymous'}</span></div>
        `;
        card.onclick = () => {
          map.setView([v.lat, v.lng], 14);
          marker.openPopup();
        };
        listContainer.appendChild(card);
      });
    }

    map.on('click', async (e) => {
      const { lat, lng } = e.latlng;
      let fetchedAddress = "";

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&email=thegrapevinecommunity@gmail.com`);
        const data = await response.json();
        if (data && data.display_name) {
          const parts = data.display_name.split(',');
          fetchedAddress = parts.slice(0, 3).join(',').trim();
        }
      } catch (err) {}

      const popupContent = `
        <div style="min-width: 200px">
          <h4 style="margin:0 0 6px 0; color:#ff007f; font-weight:bold;">Add Venue Recommendation</h4>
          <label style="font-size:11px; color:#aaa;">Venue Name:</label>
          <input id="new-name" class="custom-input" placeholder="e.g. The Sound Box" />
          
          <label style="font-size:11px; color:#aaa;">Address:</label>
          <input id="new-address" class="custom-input" value="${fetchedAddress}" placeholder="e.g. 12 High St" />

          <label style="font-size:11px; color:#aaa;">Genre / Vibe:</label>
          <input id="new-genre" class="custom-input" placeholder="e.g. Punk / Hardcore" />
          
          <label style="font-size:11px; color:#aaa;">Your Name:</label>
          <input id="new-author" class="custom-input" placeholder="e.g. Molly" />
          
          <label style="font-size:11px; color:#aaa;">Community Note:</label>
          <input id="new-note" class="custom-input" placeholder="Why do you love it?" />
          
          <button onclick="window.saveNewVenue(${lat}, ${lng})" style="width:100%; background:#ff007f; color:#000; font-weight:bold; padding:8px; border:none; border-radius:4px; cursor:pointer; margin-top:8px;">Submit Pin</button>
        </div>
      `;

      L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);
    });

    window.saveNewVenue = async (lat, lng) => {
      const name = document.getElementById('new-name').value.trim();
      const address = document.getElementById('new-address').value.trim();
      const genre = document.getElementById('new-genre').value.trim();
      const author = document.getElementById('new-author').value.trim() || "Anonymous";
      const note = document.getElementById('new-note').value.trim();

      if (!name || !genre) {
        alert("Please provide at least a Venue Name and Genre!");
        return;
      }

      try {
        await push(venuesRef, { name, address, genre, lat, lng, note, author, createdAt: Date.now() });
        map.closePopup();
      } catch (err) {
        alert("Error saving venue pin: " + err.message);
      }
    };

    window.filterVenues = () => {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = venues.filter(v => 
        v.name.toLowerCase().includes(query) || 
        v.genre.toLowerCase().includes(query) || 
        (v.address && v.address.toLowerCase().includes(query)) ||
        (v.author && v.author.toLowerCase().includes(query))
      );
      renderVenues(filtered);
    };
  </script>
</body>
</html>
